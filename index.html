<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spital – Luxury Household Fintech</title>
    
    <link id="manifest-link" rel="manifest" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: { DEFAULT: '#D4AF37', dark: '#AA8C2C' }, dark: { DEFAULT: '#0a0a0a', card: '#161616', border: '#2a2a2a' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(22, 22, 22, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.15); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(212, 175, 55, 0.3); color: white; transition: all 0.3s ease; }
        .glass-input:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .btn-gold { background: linear-gradient(135deg, #D4AF37, #AA8C2C); color: black; font-weight: bold; transition: transform 0.2s, opacity 0.2s; }
        .btn-gold:active { transform: scale(0.96); opacity: 0.8; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #D4AF37; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] w-11/12 max-w-md flex flex-col gap-2 pointer-events-none"></div>

    <div id="app" class="w-full h-full flex flex-col relative">
        <div id="auth-view" class="absolute inset-0 z-50 bg-black flex flex-col justify-center items-center p-6 hidden">
            <div class="text-center mb-10 fade-in"><i class="fa-solid fa-gem text-gold text-5xl mb-4"></i><h1 class="text-3xl font-light tracking-widest uppercase">Spital</h1></div>
            <form id="auth-form" class="glass w-full max-w-sm p-6 rounded-2xl flex flex-col gap-4 fade-in">
                <h2 id="auth-title" class="text-xl font-semibold mb-2">Přihlášení</h2>
                <input type="email" id="auth-email" placeholder="E-mail" class="glass-input p-3 rounded-xl w-full" required>
                <input type="password" id="auth-password" placeholder="Heslo" class="glass-input p-3 rounded-xl w-full" required>
                <button type="submit" class="btn-gold p-3 rounded-xl mt-2 flex justify-center items-center">
                    <span id="auth-btn-text">Vstoupit</span><div id="auth-loader" class="loader ml-2 hidden"></div>
                </button>
                <div class="flex justify-between text-sm text-gray-400 mt-2">
                    <span id="toggle-auth" class="cursor-pointer hover:text-gold">Vytvořit účet</span>
                </div>
            </form>
        </div>

        <div id="household-setup-view" class="absolute inset-0 z-40 bg-black flex flex-col justify-center items-center p-6 hidden">
            <div class="glass w-full max-w-sm p-6 rounded-2xl flex flex-col gap-6 fade-in">
                <h2 class="text-2xl font-semibold text-center text-gold">Domácnost</h2>
                <div class="flex flex-col gap-3"><input type="text" id="invite-code" placeholder="AURA-XXXX-XXXX" class="glass-input p-3 rounded-xl text-center uppercase"><button onclick="joinHousehold()" class="border border-gold text-gold p-3 rounded-xl hover:bg-gold hover:text-black">Připojit přes kód</button></div>
                <div class="text-center text-gray-500 text-sm border-t border-dark-border pt-4">NEBO</div>
                <div class="flex flex-col gap-3"><input type="text" id="new-household-name" placeholder="Název domácnosti" class="glass-input p-3 rounded-xl"><button onclick="createHousehold()" class="btn-gold p-3 rounded-xl">Založit domácnost</button></div>
                <button onclick="logout()" class="text-gray-500 text-sm mt-2">Odhlásit se</button>
            </div>
        </div>

        <div id="main-view" class="flex-1 flex flex-col overflow-hidden hidden bg-gradient-to-b from-dark to-black">
            <header class="glass px-6 py-4 flex justify-between items-center z-10">
                <div class="flex items-center gap-2"><i class="fa-solid fa-gem text-gold"></i><h1 class="font-light tracking-wider" id="header-household-name">Spital</h1></div>
                <div class="flex gap-4 text-gray-400"><i class="fa-solid fa-gear cursor-pointer hover:text-gold"></i></div>
            </header>

            <main id="content-area" class="flex-1 overflow-y-auto p-4 pb-24 relative"></main>

            <nav id="bottom-nav" class="glass absolute bottom-0 w-full flex justify-around p-3 z-20 text-gray-500 text-xs">
                <button onclick="switchTab('dashboard')" class="nav-btn w-16 text-gold" data-target="dashboard"><i class="fa-solid fa-chart-pie text-lg block mb-1"></i>Přehled</button>
                <button onclick="switchTab('finance')" class="nav-btn w-16 hover:text-white" data-target="finance"><i class="fa-solid fa-wallet text-lg block mb-1"></i>Finance</button>
                <button onclick="switchTab('assets')" class="nav-btn w-16 hover:text-white" data-target="assets"><i class="fa-solid fa-box-open text-lg block mb-1"></i>Majetek</button>
                <button onclick="switchTab('more')" class="nav-btn w-16 hover:text-white" data-target="more"><i class="fa-solid fa-bars text-lg block mb-1"></i>Více</button>
            </nav>
        </div>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/80 z-[60] hidden flex-col justify-end">
        <div id="modal-content" class="glass w-full rounded-t-3xl p-6 fade-in max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script>
        // PWA Setup
        const manifestData = { name: "Spital", short_name: "Spital", start_url: ".", display: "standalone", background_color: "#000", theme_color: "#D4AF37" };
        document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifestData)], { type: 'application/json' }));

        // SUPABASE INIT - ZDE VLOŽ SVŮJ KLÍČ
        const SUPABASE_URL = "https://sbkiqctjfatozqnixhab.supabase.co";
        const SUPABASE_ANON_KEY = "VLOŽÍM_SVŮJ_ANON_KEY"; 
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // GLOBAL STATE
        let state = { user: null, household: null, members: [], transactions: [], inventory: [], tasks: [], chat: [], activeTab: 'dashboard', chartInstance: null };

        // UTILS
        const $ = id => document.getElementById(id);
        const formatMoney = a => new Intl.NumberFormat('cs-CZ', { style: 'currency', currency: 'CZK' }).format(a || 0);
        const formatDate = d => new Date(d).toLocaleDateString('cs-CZ');
        
        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            const colors = { info: 'border-gold text-gold', error: 'border-red-500 text-red-500', success: 'border-green-500 text-green-500' };
            t.className = `glass p-3 rounded-xl border ${colors[type]} flex items-center gap-3 fade-in shadow-lg text-sm`;
            t.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${msg}</span>`;
            $('toast-container').appendChild(t);
            setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3000);
        }

        function closeModal() { $('modal-container').classList.replace('flex', 'hidden'); }
        function openModal(html) { $('modal-content').innerHTML = html; $('modal-container').classList.replace('hidden', 'flex'); }

        // AUTH
        let isLogin = true;
        $('toggle-auth').onclick = () => { isLogin = !isLogin; $('auth-title').innerText = isLogin ? 'Přihlášení' : 'Registrace'; $('auth-btn-text').innerText = isLogin ? 'Vstoupit' : 'Vytvořit účet'; $('toggle-auth').innerText = isLogin ? 'Vytvořit účet' : 'Mám účet'; };
        
        $('auth-form').onsubmit = async (e) => {
            e.preventDefault(); $('auth-loader').classList.remove('hidden'); $('auth-btn-text').classList.add('hidden');
            const email = $('auth-email').value, password = $('auth-password').value;
            const res = isLogin ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
            $('auth-loader').classList.add('hidden'); $('auth-btn-text').classList.remove('hidden');
            if(res.error) showToast(res.error.message, 'error'); else if(!isLogin) showToast('Potvrďte email', 'success');
        };

        async function logout() { await sb.auth.signOut(); location.reload(); }

        sb.auth.onAuthStateChange((event, session) => { 
            if(session) { state.user = session.user; initApp(); } 
            else { $('auth-view').classList.remove('hidden'); $('main-view').classList.add('hidden'); $('household-setup-view').classList.add('hidden'); }
        });

        // INIT APP & HOUSEHOLD
        async function initApp() {
            $('auth-view').classList.add('hidden');
            const { data: member } = await sb.from('household_members').select('household_id, role').eq('user_id', state.user.id).single();
            if(member) {
                const { data: house } = await sb.from('households').select('*').eq('id', member.household_id).single();
                state.household = house;
                $('header-household-name').innerText = house.name;
                $('household-setup-view').classList.add('hidden'); $('main-view').classList.remove('hidden');
                
                // Fetch members emails via RPC or just store them (Here we fetch auth users mapped if possible, or just raw IDs)
                const { data: mData } = await sb.from('household_members').select('user_id, role').eq('household_id', house.id);
                state.members = mData || [];
                
                switchTab('dashboard');
            } else {
                $('household-setup-view').classList.remove('hidden');
            }
        }

        async function createHousehold() {
            const name = $('new-household-name').value; if(!name) return;
            const code = 'AURA-' + Math.random().toString(36).substring(2,6).toUpperCase() + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
            const { data: house, error } = await sb.from('households').insert([{ name, invite_code: code }]).select().single();
            if(error) return showToast(error.message, 'error');
            await sb.from('household_members').insert([{ household_id: house.id, user_id: state.user.id, role: 'Owner' }]);
            initApp();
        }

        async function joinHousehold() {
            const code = $('invite-code').value.trim();
            const { data: house } = await sb.from('households').select('id').eq('invite_code', code).single();
            if(!house) return showToast('Neplatný kód', 'error');
            await sb.from('household_members').insert([{ household_id: house.id, user_id: state.user.id, role: 'Member' }]);
            initApp();
        }

        // ROUTER & DATA FETCH
        async function switchTab(tabId) {
            state.activeTab = tabId;
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.replace('text-gold', 'text-gray-500'); if(b.dataset.target === tabId || (['tasks','chat'].includes(tabId) && b.dataset.target==='more')) b.classList.replace('text-gray-500', 'text-gold'); });
            $('content-area').innerHTML = `<div class="flex justify-center mt-20"><div class="loader"></div></div>`;
            
            const hid = state.household.id;
            const [tRes, iRes, taskRes] = await Promise.all([
                sb.from('transactions').select('*').eq('household_id', hid).order('date', {ascending: false}),
                sb.from('inventory').select('*').eq('household_id', hid).order('created_at', {ascending: false}),
                sb.from('tasks').select('*').eq('household_id', hid).order('due_date', {ascending: true})
            ]);
            state.transactions = tRes.data || []; state.inventory = iRes.data || []; state.tasks = taskRes.data || [];
            
            if(tabId === 'chat') {
                const {data} = await sb.from('chat_messages').select('*').eq('household_id', hid).order('created_at', {ascending: true});
                state.chat = data || [];
            }

            const views = { dashboard: renderDashboard, finance: renderFinance, assets: renderAssets, more: renderMore, tasks: renderTasks, chat: renderChat, ai: renderAI };
            if(views[tabId]) views[tabId]();
        }

        // --- DASHBOARD (S reálným Chart.js výpočtem) ---
        function renderDashboard() {
            const inc = state.transactions.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
            const exp = state.transactions.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
            const pendingTasks = state.tasks.filter(t => !t.is_completed).length;

            $('content-area').innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="glass p-6 rounded-2xl relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-gold/20 rounded-full blur-3xl"></div>
                        <h2 class="text-gray-400 text-sm uppercase">Zůstatek</h2>
                        <div class="text-4xl font-light text-white mt-1">${formatMoney(inc - exp)}</div>
                        <div class="flex gap-4 mt-4 text-sm">
                            <span class="text-green-400"><i class="fa-solid fa-arrow-up"></i> ${formatMoney(inc)}</span>
                            <span class="text-red-400"><i class="fa-solid fa-arrow-down"></i> ${formatMoney(exp)}</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass p-4 rounded-xl text-center"><i class="fa-solid fa-list-check text-gold mb-1 text-lg"></i><div class="text-xs text-gray-400">Aktivní úkoly</div><div class="font-bold text-lg">${pendingTasks}</div></div>
                        <div class="glass p-4 rounded-xl text-center cursor-pointer" onclick="navigator.clipboard.writeText('${state.household.invite_code}'); showToast('Kód zkopírován','success')"><i class="fa-solid fa-user-plus text-gold mb-1 text-lg"></i><div class="text-xs text-gray-400">Invite Kód</div><div class="font-bold text-xs mt-1">${state.household.invite_code}</div></div>
                    </div>

                    <div class="glass p-4 rounded-2xl"><h3 class="text-sm text-gray-400 mb-4">Cashflow (Posledních 6 měsíců)</h3><canvas id="dashboardChart" height="200"></canvas></div>
                </div>
            `;
            initRealChart();
        }

        function initRealChart() {
            if(state.chartInstance) state.chartInstance.destroy();
            
            // Reálná agregace dat z transakcí za posledních 6 měsíců
            const months = []; const incomes = []; const expenses = [];
            for(let i=5; i>=0; i--) {
                const d = new Date(); d.setMonth(d.getMonth() - i);
                months.push(d.toLocaleString('cs-CZ', {month: 'short'}));
                const monthTrans = state.transactions.filter(t => {
                    const td = new Date(t.date); return td.getMonth() === d.getMonth() && td.getFullYear() === d.getFullYear();
                });
                incomes.push(monthTrans.filter(t => t.type==='income').reduce((s,t)=>s+t.amount,0));
                expenses.push(monthTrans.filter(t => t.type==='expense').reduce((s,t)=>s+t.amount,0));
            }

            state.chartInstance = new Chart($('dashboardChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [
                        { label: 'Příjmy', data: incomes, backgroundColor: '#4ade80', borderRadius: 4 },
                        { label: 'Výdaje', data: expenses, backgroundColor: '#f87171', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
            });
        }

        // --- FINANCE ---
        function renderFinance() {
            $('content-area').innerHTML = `
                <div class="fade-in space-y-4">
                    <button onclick="showFinanceModal()" class="btn-gold w-full p-3 rounded-xl"><i class="fa-solid fa-plus mr-2"></i>Nová transakce</button>
                    <div class="space-y-3">
                        ${state.transactions.map(t => `
                            <div class="glass p-4 rounded-xl flex justify-between items-center relative">
                                <div><div class="font-semibold">${t.category}</div><div class="text-xs text-gray-400">${formatDate(t.date)} ${t.note ? '| '+t.note : ''}</div></div>
                                <div class="flex items-center gap-4">
                                    <span class="font-bold text-${t.type==='income'?'green':'red'}-400">${t.type==='income'?'+':'-'}${formatMoney(t.amount)}</span>
                                    <i class="fa-solid fa-trash text-gray-500 hover:text-red-500" onclick="del('transactions','${t.id}','finance')"></i>
                                </div>
                            </div>
                        `).join('') || '<div class="text-center text-gray-500 mt-10">Žádné transakce</div>'}
                    </div>
                </div>
            `;
        }

        function showFinanceModal() {
            openModal(`
                <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold text-gold">Přidat transakci</h2><i class="fa-solid fa-times text-xl" onclick="closeModal()"></i></div>
                <form onsubmit="saveFinance(event)">
                    <select id="f-type" class="glass-input p-3 rounded-xl w-full mb-3"><option value="expense">Výdaj</option><option value="income">Příjem</option></select>
                    <input type="number" id="f-amount" placeholder="Částka" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <input type="text" id="f-category" placeholder="Kategorie (např. Potraviny)" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <input type="date" id="f-date" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <input type="text" id="f-note" placeholder="Poznámka" class="glass-input p-3 rounded-xl w-full mb-6">
                    <button type="submit" class="btn-gold w-full p-4 rounded-xl">Uložit do financí</button>
                </form>
            `);
            $('f-date').valueAsDate = new Date();
        }

        async function saveFinance(e) {
            e.preventDefault();
            await sb.from('transactions').insert([{ household_id: state.household.id, type: $('f-type').value, amount: parseFloat($('f-amount').value), category: $('f-category').value, date: $('f-date').value, note: $('f-note').value }]);
            closeModal(); switchTab('finance');
        }

        // --- MAJETEK (INVENTORY) ---
        function renderAssets() {
            const total = state.inventory.reduce((s,i)=>s+i.price,0);
            $('content-area').innerHTML = `
                <div class="fade-in space-y-4">
                    <div class="glass p-4 rounded-xl text-center"><div class="text-gray-400 text-sm">Celková hodnota majetku</div><div class="text-2xl font-bold text-gold">${formatMoney(total)}</div></div>
                    <button onclick="showAssetModal()" class="border border-gold text-gold w-full p-3 rounded-xl"><i class="fa-solid fa-plus mr-2"></i>Přidat položku</button>
                    <div class="space-y-3">
                        ${state.inventory.map(i => {
                            const wEnd = new Date(i.warranty_end);
                            const isExpiring = wEnd > new Date() && wEnd < new Date(Date.now() + 30*24*60*60*1000);
                            return `
                            <div class="glass p-4 rounded-xl">
                                <div class="flex justify-between items-start mb-2">
                                    <div><div class="font-bold text-gold">${i.name}</div><div class="text-xs text-gray-400">${i.category || 'Bez kategorie'} | ${i.store || 'Neznámý obchod'}</div></div>
                                    <div class="text-right"><div class="font-bold">${formatMoney(i.price)}</div><i class="fa-solid fa-trash text-gray-500 mt-2 hover:text-red-500" onclick="del('inventory','${i.id}','assets')"></i></div>
                                </div>
                                <div class="text-xs p-2 rounded bg-dark border border-dark-border flex justify-between ${isExpiring ? 'text-orange-400 border-orange-500/50' : 'text-gray-400'}">
                                    <span>Nákup: ${formatDate(i.purchase_date)}</span>
                                    <span>Záruka: ${formatDate(i.warranty_end)} ${isExpiring ? '<i class="fa-solid fa-triangle-exclamation"></i>' : ''}</span>
                                </div>
                            </div>
                        `}).join('') || '<div class="text-center text-gray-500 mt-10">Zatím žádný majetek</div>'}
                    </div>
                </div>
            `;
        }

        function showAssetModal() {
            openModal(`
                <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold text-gold">Přidat majetek</h2><i class="fa-solid fa-times text-xl" onclick="closeModal()"></i></div>
                <form onsubmit="saveAsset(event)">
                    <input type="text" id="a-name" placeholder="Název předmětu (např. MacBook Pro)" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input type="number" id="a-price" placeholder="Cena (CZK)" class="glass-input p-3 rounded-xl w-full" required>
                        <input type="text" id="a-cat" placeholder="Kategorie" class="glass-input p-3 rounded-xl w-full">
                    </div>
                    <input type="text" id="a-store" placeholder="Obchod" class="glass-input p-3 rounded-xl w-full mb-3">
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div><label class="text-xs text-gray-400 ml-1">Nákup</label><input type="date" id="a-buy" class="glass-input p-3 rounded-xl w-full" required></div>
                        <div><label class="text-xs text-gray-400 ml-1">Konec záruky</label><input type="date" id="a-war" class="glass-input p-3 rounded-xl w-full" required></div>
                    </div>
                    <button type="submit" class="btn-gold w-full p-4 rounded-xl mt-4">Uložit majetek</button>
                </form>
            `);
        }

        async function saveAsset(e) {
            e.preventDefault();
            await sb.from('inventory').insert([{ household_id: state.household.id, name: $('a-name').value, price: parseFloat($('a-price').value), category: $('a-cat').value, store: $('a-store').value, purchase_date: $('a-buy').value, warranty_end: $('a-war').value }]);
            closeModal(); switchTab('assets');
        }

        // --- ÚKOLY (TASKS) ---
        function renderTasks() {
            $('content-area').innerHTML = `
                <div class="fade-in space-y-4">
                    <h2 class="text-2xl font-bold text-gold mb-4">Rodinné Úkoly</h2>
                    <button onclick="showTaskModal()" class="btn-gold w-full p-3 rounded-xl mb-4"><i class="fa-solid fa-plus mr-2"></i>Nový úkol</button>
                    <div class="space-y-3">
                        ${state.tasks.map(t => `
                            <div class="glass p-4 rounded-xl flex items-center gap-4 ${t.is_completed ? 'opacity-50' : ''}">
                                <div class="w-6 h-6 rounded border border-gold flex items-center justify-center cursor-pointer ${t.is_completed ? 'bg-gold text-black' : ''}" onclick="toggleTask('${t.id}', ${!t.is_completed})">
                                    ${t.is_completed ? '<i class="fa-solid fa-check text-sm"></i>' : ''}
                                </div>
                                <div class="flex-1">
                                    <div class="font-bold ${t.is_completed ? 'line-through' : ''}">${t.title}</div>
                                    <div class="text-xs text-gray-400">Do: ${formatDate(t.due_date)} | Priorita: ${t.priority}</div>
                                </div>
                                <i class="fa-solid fa-trash text-gray-500 hover:text-red-500" onclick="del('tasks','${t.id}','tasks')"></i>
                            </div>
                        `).join('') || '<div class="text-center text-gray-500 mt-10">Vše hotovo!</div>'}
                    </div>
                </div>
            `;
        }

        function showTaskModal() {
            openModal(`
                <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold text-gold">Nový úkol</h2><i class="fa-solid fa-times text-xl" onclick="closeModal()"></i></div>
                <form onsubmit="saveTask(event)">
                    <input type="text" id="t-title" placeholder="Co je potřeba udělat?" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <input type="date" id="t-due" class="glass-input p-3 rounded-xl w-full mb-3" required>
                    <select id="t-pri" class="glass-input p-3 rounded-xl w-full mb-4">
                        <option value="Low">Nízká priorita</option><option value="Medium" selected>Střední priorita</option><option value="High">Vysoká priorita</option>
                    </select>
                    <button type="submit" class="btn-gold w-full p-4 rounded-xl">Přidat úkol</button>
                </form>
            `);
        }

        async function saveTask(e) {
            e.preventDefault();
            await sb.from('tasks').insert([{ household_id: state.household.id, title: $('t-title').value, due_date: $('t-due').value, priority: $('t-pri').value }]);
            closeModal(); switchTab('tasks');
        }

        async function toggleTask(id, isCompleted) {
            await sb.from('tasks').update({ is_completed: isCompleted }).eq('id', id);
            switchTab('tasks');
        }

        // --- VÍCE & OSTATNÍ ---
        function renderMore() {
            $('content-area').innerHTML = `
                <div class="grid grid-cols-2 gap-4 fade-in">
                    <div class="glass p-6 rounded-2xl flex flex-col items-center cursor-pointer hover:border-gold" onclick="switchTab('tasks')"><i class="fa-solid fa-list-check text-2xl text-gold mb-2"></i>Úkoly</div>
                    <div class="glass p-6 rounded-2xl flex flex-col items-center cursor-pointer hover:border-gold" onclick="switchTab('chat')"><i class="fa-regular fa-comments text-2xl text-gold mb-2"></i>Chat</div>
                    <div class="glass p-6 rounded-2xl flex flex-col items-center cursor-pointer hover:border-gold" onclick="switchTab('ai')"><i class="fa-solid fa-wand-magic-sparkles text-2xl text-gold mb-2"></i>Aura AI</div>
                    <div class="glass p-6 rounded-2xl flex flex-col items-center cursor-pointer hover:border-red-500" onclick="logout()"><i class="fa-solid fa-power-off text-2xl text-red-500 mb-2"></i>Odhlásit</div>
                </div>
            `;
        }

        function renderChat() {
            $('content-area').innerHTML = `
                <div class="fade-in flex flex-col h-full">
                    <div id="chat-box" class="flex-1 overflow-y-auto space-y-3 mb-20 pb-4">
                        ${state.chat.map(m => `
                            <div class="flex ${m.user_id === state.user.id ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[80%] p-3 text-sm rounded-2xl ${m.user_id === state.user.id ? 'bg-gold text-black rounded-tr-none' : 'glass rounded-tl-none'}">${m.message}</div>
                            </div>
                        `).join('') || '<div class="text-center text-gray-500 mt-10">Začněte konverzaci...</div>'}
                    </div>
                    <form onsubmit="sendChat(event)" class="absolute bottom-16 left-0 w-full p-4 glass flex gap-2">
                        <input type="text" id="c-msg" class="flex-1 glass-input p-3 rounded-full" placeholder="Napsat zprávu..." required>
                        <button type="submit" class="w-12 h-12 rounded-full btn-gold flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            `;
            setTimeout(() => { const c = $('chat-box'); if(c) c.scrollTop = c.scrollHeight; }, 100);
        }

        async function sendChat(e) {
            e.preventDefault(); const m = $('c-msg').value; $('c-msg').value = '';
            await sb.from('chat_messages').insert([{ household_id: state.household.id, user_id: state.user.id, message: m }]);
            switchTab('chat');
        }

        function renderAI() {
            $('content-area').innerHTML = `<div class="glass p-6 rounded-xl text-center"><i class="fa-solid fa-wand-magic-sparkles text-4xl text-gold mb-4"></i><h2 class="text-xl font-bold">Aura AI</h2><p class="text-gray-400 text-sm mt-2">Finanční analýza napojená na OpenAI vyžaduje serverless backend pro skrytí API klíče.</p></div>`;
        }

        async function del(table, id, tab) { if(confirm('Opravdu smazat?')) { await sb.from(table).delete().eq('id', id); switchTab(tab); } }
    </script>
</body>
</html>
